# Quy tắc chọn transport theo ứng dụng (issue #67) — PinaKey tự chọn cách gõ tốt nhất
# cho từng app, người dùng không cần hiểu "preedit vs replace".
#
# Cú pháp: mỗi dòng `<transport> <mẫu-tên-chương-trình>`
#   - transport: preedit | replace | auto
#   - mẫu: so KHÔNG phân biệt hoa/thường với program()/wm_class — khớp khi bằng đúng
#     hoặc là chuỗi con (như danh sách loại trừ tiếng Anh #9).
# Dòng khớp SAU thắng dòng khớp trước. Thứ tự lớp: file này (nhúng trong binary)
# → /usr/share/pinakey/transport-rules.conf → ~/.config/pinakey/transport-rules.conf
# (rule người dùng thắng tất cả).

# LibreOffice/OpenOffice (#66): quảng cáo SurroundingText nhưng báo cáo lạc hậu/thiếu
# dấu cách khi gõ nhanh → diff xoá-chèn sai vùng. Luôn dùng preedit.
preedit soffice
preedit libreoffice

# Terminal: preedit là đường ổn định nhất; terminal nào có quảng cáo SurroundingText
# cũng không nên tin (VTE chẳng hạn: im_retrieve_surrounding/im_delete_surrounding đều
# return false, lệnh xoá bay vào hư không).
#
# LƯU Ý: trên phiên GNOME Wayland, fcitx5 nhận phím qua frontend IBus và input context
# LUÔN có program rỗng (mutter cũng dùng chung một context cho mọi app), nên KHÔNG rule
# nào ở đây khớp được. Ở đó lá chắn là điều kiện "client phải thật sự gửi surrounding
# text" trong addon. Các rule dưới đây bảo vệ phiên X11 và các frontend có tên chương
# trình (fcitx5-gtk/fcitx5-qt, XIM).
preedit gnome-terminal
preedit konsole
preedit xterm
preedit alacritty
preedit kitty
preedit wezterm
preedit tilix
preedit xfce4-terminal
preedit terminator
preedit urxvt
preedit rxvt
preedit kgx
preedit org.gnome.console
preedit ptyxis
preedit foot
preedit ghostty
preedit contour
preedit terminology
preedit sakura
preedit guake
preedit yakuake
preedit tilda
preedit cool-retro-term
preedit blackbox
preedit mate-terminal
preedit lxterminal
preedit qterminal
preedit deepin-terminal
preedit io.elementary.terminal

# Cửa sổ THIẾT LẬP của terminal là hộp thoại GTK bình thường (có ô nhập chuẩn, xoá
# surrounding text đàng hoàng) — đừng để nó dính rule của chính terminal chỉ vì tên
# chứa "gnome-terminal". Dòng khớp SAU thắng nên đặt ở đây.
auto gnome-terminal-preferences
