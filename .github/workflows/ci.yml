name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push mới trên cùng một PR huỷ lượt chạy cũ (main thì không — mỗi commit trên main phải có
# kết quả riêng). Trước đây chỉ release.yml có concurrency, nên mỗi lần force-push là CI chạy
# chồng nhau, đốt runner và trả kết quả của commit đã cũ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Version sync check (Cargo.toml = nguồn duy nhất)
        run: bash tools/check-versions.sh

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  fcitx5:
    runs-on: ubuntu-latest
    # CodeQL đẩy kết quả lên tab Security của repo.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      # fcitx5 dev + module testfrontend (cho test tích hợp) + công cụ build C++.
      - name: Install fcitx5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ extra-cmake-modules pkg-config \
            fcitx5 fcitx5-modules fcitx5-modules-dev \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fcitx5-${{ hashFiles('**/Cargo.lock') }}

      # CodeQL quét addon C++ — lớp duy nhất chạm con trỏ thô, FFI và bộ đệm UTF-8, nơi #154
      # (out_of_range làm sập cả fcitx5) từng xảy ra. Init TRƯỚC build để nó theo dõi compiler;
      # lõi Rust đã có clippy + `unsafe` khoanh vùng ở pinakey-ffi nên chưa đưa vào đây (CodeQL
      # cho Rust còn ở public preview).
      - name: Init CodeQL (addon C++)
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure & build addon (cargo builds the Rust core)
        run: |
          # PINAKEY_BUILD_UINPUT_SERVER=ON: daemon opt-in nhưng CI vẫn compile-check (#72).
          cmake -S fcitx5 -B fcitx5/build -DCMAKE_INSTALL_PREFIX=/usr -DPINAKEY_BUILD_UINPUT_SERVER=ON
          cmake --build fcitx5/build

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Integration tests (run via real fcitx5 test harness)
        run: ctest --test-dir fcitx5/build --output-on-failure
